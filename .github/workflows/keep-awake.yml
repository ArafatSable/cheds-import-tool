name: keep-awake

on:
  schedule:
    # Runs every 6 hours at 17 minutes past the hour
    - cron: "17 */6 * * *"
  workflow_dispatch: # Allows you to manually trigger it from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake up Streamlit app via API
        run: |
          URL="https://arafatsable-cheds-import-tool-app-streamlit-umxrz5.streamlit.app"
          echo "Targeting app: $URL"
          
          COOKIES=$(mktemp)
          
          # Step 1: Hit the app status API to fetch cookies and extract the CSRF token
          echo "Fetching CSRF token..."
          CSRF_TOKEN=$(curl --silent --output /dev/null --dump-header - \
            --cookie-jar "$COOKIES" \
            "$URL/api/v2/app/status" \
            | tr -d '\r' \
            | awk -F': ' 'tolower($1) == "x-csrf-token" { print $2 }')
          
          if [ -z "$CSRF_TOKEN" ]; then
            echo "Error: Could not retrieve CSRF token. Streamlit API structure may have changed."
            exit 1
          fi
          echo "CSRF token successfully acquired."

          # Step 2: Generate a random fake machine ID to mimic a browser session
          MACHINE_ID=$(uuidgen | tr '[:upper:]' '[:lower:]')

          # Step 3: Send the official resume payload to wake up the app
          echo "Sending resume/wake command..."
          code=$(curl -sS \
            --cookie "$COOKIES" --cookie-jar "$COOKIES" \
            --header "x-csrf-token: $CSRF_TOKEN" \
            --header "x-streamlit-machine-id: $MACHINE_ID" \
            --header "origin: $URL" \
            --header "referer: $URL/" \
            -o /dev/null -w "%{http_code}" \
            --request POST \
            "$URL/api/v2/app/resume")
          
          echo "HTTP Response Code: $code"
          
          # A 200 means it successfully reset the timer / woke up
          if [ "$code" -eq 200 ]; then
            echo "Success! The app is awake or the sleep timer has been reset."
          else
            echo "Failed to wake app. Expected HTTP 200, got $code"
            exit 1
          fi
